name: One-time Match Roster Rules

on:
  push:
    branches:
      - feature/match-day-16-player-rosters

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/match-day-16-player-rosters
          fetch-depth: 0

      - name: Apply roster rule patch
        run: python .github/patch-match-roster-rules.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Commit implementation and remove temporary files
        run: |
          rm -f .github/patch-match-roster-rules.py
          rm -f .github/workflows/one-time-match-roster-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce 11 unique batters and bowlers with 16-player rosters"
          git push origin feature/match-day-16-player-rosters
