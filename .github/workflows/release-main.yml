name: Release Main - Web + APK

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-web:
    name: Deploy Viewer Web/PWA
    runs-on: ubuntu-latest
    concurrency:
      group: viewer-pwa-pages
      cancel-in-progress: true
    environment:
      name: viewer-pwa-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Expo web runtime
        run: npx expo install react-dom react-native-web @expo/metro-runtime -- --no-save

      - name: TypeScript check
        run: npm run typecheck

      - name: Export web app
        run: npx expo export -p web

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-release-title:
    name: Sync minor release title
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Keep vMAJOR.MINOR release title on latest patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CONFIG_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name")
          IFS='.' read -r MAJOR MINOR CONFIG_PATCH <<< "$CONFIG_VERSION"

          SERIES="${MAJOR}.${MINOR}"
          SERIES_TAG="v${SERIES}"

          if ! gh release view "$SERIES_TAG" >/dev/null 2>&1; then
            echo "No $SERIES_TAG release exists yet."
            exit 0
          fi

          MAX_PATCH=-1
          while IFS= read -r ASSET; do
            if [[ "$ASSET" =~ ^Cricket\.Zone\.App\.v${MAJOR}\.${MINOR}\.([0-9]+)\.apk$ ]]; then
              PATCH="${BASH_REMATCH[1]}"
              if (( PATCH > MAX_PATCH )); then
                MAX_PATCH=$PATCH
              fi
            fi
          done < <(gh release view "$SERIES_TAG" --json assets --jq '.assets[].name')

          if (( MAX_PATCH < 0 )); then
            echo "No ${SERIES}.x APK asset found on $SERIES_TAG."
            exit 0
          fi

          LATEST_VERSION="${MAJOR}.${MINOR}.${MAX_PATCH}"
          RELEASE_TITLE="$APP_NAME v$LATEST_VERSION"
          RELEASE_NOTES=$(printf 'Android builds for the %s.x release line.\n\nLatest APK: %s v%s\n\nAll %s.x APK builds are available as assets on this release.' "$SERIES" "$APP_NAME" "$LATEST_VERSION" "$SERIES")

          gh release edit "$SERIES_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES"

  build-apk:
    name: Build and publish Android APK
    if: ${{ !contains(github.event.head_commit.message, '[release-migration-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Determine next APK version
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CONFIG_VERSION=$(node -p "require('./app.json').expo.version")
          APP_NAME=$(node -p "require('./app.json').expo.name")

          IFS='.' read -r MAJOR MINOR CONFIG_PATCH <<< "$CONFIG_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$CONFIG_PATCH" =~ ^[0-9]+$ ]]; then
            echo "app.json expo.version must use major.minor.patch format. Found: $CONFIG_VERSION"
            exit 1
          fi

          SERIES="${MAJOR}.${MINOR}"
          SERIES_TAG="v${SERIES}"
          MAX_PATCH=-1
          FOUND_EXISTING=false

          # Read older patch-level releases such as v1.7.1 and v1.7.2.
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v${MAJOR}\.${MINOR}\.([0-9]+)$ ]]; then
              PATCH="${BASH_REMATCH[1]}"
              FOUND_EXISTING=true
              if (( PATCH > MAX_PATCH )); then
                MAX_PATCH=$PATCH
              fi
            fi
          done < <(gh release list --limit 200 --json tagName --jq '.[].tagName')

          # Read APKs already grouped under the minor-series release, e.g. v1.7.
          if gh release view "$SERIES_TAG" >/dev/null 2>&1; then
            while IFS= read -r ASSET; do
              if [[ "$ASSET" =~ ^Cricket\.Zone\.App\.v${MAJOR}\.${MINOR}\.([0-9]+)\.apk$ ]]; then
                PATCH="${BASH_REMATCH[1]}"
                FOUND_EXISTING=true
                if (( PATCH > MAX_PATCH )); then
                  MAX_PATCH=$PATCH
                fi
              fi
            done < <(gh release view "$SERIES_TAG" --json assets --jq '.assets[].name')
          fi

          if [[ "$FOUND_EXISTING" == "true" ]]; then
            if (( CONFIG_PATCH > MAX_PATCH )); then
              MAX_PATCH=$CONFIG_PATCH
            fi
            NEXT_PATCH=$((MAX_PATCH + 1))
          else
            NEXT_PATCH=$CONFIG_PATCH
          fi

          VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          VERSION_CODE=$((2000000 + MAJOR * 100000 + MINOR * 1000 + NEXT_PATCH))
          APK_NAME="Cricket.Zone.App.v${VERSION}.apk"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          echo "series_tag=$SERIES_TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

          VERSION="$VERSION" VERSION_CODE="$VERSION_CODE" node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = process.env.VERSION;
          app.expo.android.versionCode = Number(process.env.VERSION_CODE);
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

          python - <<PY
          from pathlib import Path
          import re

          path = Path('android/app/build.gradle')
          text = path.read_text()
          text, code_count = re.subn(r'versionCode\s+\d+', 'versionCode ${VERSION_CODE}', text, count=1)
          text, name_count = re.subn(r'versionName\s+"[^"]+"', 'versionName "${VERSION}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not synchronize Android version metadata')
          path.write_text(text)
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.app.outputs.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.app_name }} v${{ steps.app.outputs.version }}
          path: ${{ steps.app.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK under minor version tag
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ steps.app.outputs.series }}
          SERIES_TAG: ${{ steps.app.outputs.series_tag }}
          APP_VERSION: ${{ steps.app.outputs.version }}
          VERSION_CODE: ${{ steps.app.outputs.version_code }}
          APP_NAME: ${{ steps.app.outputs.app_name }}
          APK_NAME: ${{ steps.app.outputs.apk_name }}
        shell: bash
        run: |
          RELEASE_TITLE="$APP_NAME v$APP_VERSION"
          RELEASE_NOTES=$(printf 'Android builds for the %s.x release line.\n\nLatest APK: %s v%s\nAndroid version code: %s\nLatest commit: %s\n\nAll %s.x APK builds are available as assets on this release.' "$SERIES" "$APP_NAME" "$APP_VERSION" "$VERSION_CODE" "$GITHUB_SHA" "$SERIES")

          if gh release view "$SERIES_TAG" >/dev/null 2>&1; then
            gh release edit "$SERIES_TAG" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          else
            gh release create "$SERIES_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi

          # Keep older patch APKs under the same vMAJOR.MINOR release where available.
          while IFS= read -r LEGACY_TAG; do
            if [[ "$LEGACY_TAG" =~ ^v${SERIES//./\.}\.[0-9]+$ ]]; then
              TMP_DIR=$(mktemp -d)
              if gh release download "$LEGACY_TAG" --pattern '*.apk' --dir "$TMP_DIR" >/dev/null 2>&1; then
                for FILE in "$TMP_DIR"/*.apk; do
                  [[ -e "$FILE" ]] || continue
                  ASSET_NAME=$(basename "$FILE")
                  if ! gh release view "$SERIES_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET_NAME"; then
                    gh release upload "$SERIES_TAG" "$FILE"
                  fi
                done
              fi
              rm -rf "$TMP_DIR"
            fi
          done < <(gh release list --limit 200 --json tagName --jq '.[].tagName')

          gh release upload "$SERIES_TAG" "$APK_NAME" --clobber
