name: One-time Viewer Over Spacing Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch desktop scorecard spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/web/ViewerWebApp.tsx')
          text = path.read_text()

          old_panel = """              <Panel>\n                <Text style={styles.tableTitle}>Over-by-over</Text>"""
          new_panel = """              <Panel style={styles.overByOverPanel}>\n                <Text style={styles.tableTitle}>Over-by-over</Text>"""
          if text.count(old_panel) != 1:
              raise SystemExit(f'Expected exactly one Over-by-over panel target, found {text.count(old_panel)}')
          text = text.replace(old_panel, new_panel)

          old_style = """  extras: { color: colors.muted, fontSize: 9, marginTop: 10 },\n  overRow:"""
          new_style = """  extras: { color: colors.muted, fontSize: 9, marginTop: 10 },\n  overByOverPanel: { marginTop: 14 },\n  overRow:"""
          if text.count(old_style) != 1:
              raise SystemExit(f'Expected exactly one style insertion target, found {text.count(old_style)}')
          text = text.replace(old_style, new_style)

          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/one-time-viewer-over-spacing-fix.yml

      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/ViewerWebApp.tsx
          git commit -m "Fix desktop over-by-over card spacing"
          git push origin main
