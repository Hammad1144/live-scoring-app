name: One-time High Resolution App Icon

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 512px PNG icon
        run: |
          base64 -d .github/icon-source.b64 > /tmp/cricket-zone-icon.jpg
          convert /tmp/cricket-zone-icon.jpg -resize 512x512 assets/icon.png
          file assets/icon.png
          identify assets/icon.png

      - name: Clean temporary icon files
        run: |
          rm -f .github/icon-source.b64
          rm -f assets/pwa-icon.svg
          rm -f .github/workflows/one-time-hires-icon.yml

      - name: Commit icon to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon.png .github/icon-source.b64 assets/pwa-icon.svg .github/workflows/one-time-hires-icon.yml
          git commit -m "Replace app icon with high-resolution Cricket Zone logo"
          git push origin main
