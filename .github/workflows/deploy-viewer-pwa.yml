name: Deploy Viewer PWA

on:
  push:
    branches:
      - feature/viewer-pwa
    paths:
      - 'web/**'
      - 'assets/icon.png'
      - '.github/workflows/deploy-viewer-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viewer-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and publish Viewer PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: node --check web/app.js

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R web/. dist/
          cp assets/icon.png dist/icon.png
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Viewer PWA from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
