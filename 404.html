<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07130d" />
  <meta name="description" content="Cricket Zone viewer — seasons, match history, players and leaderboards." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cricket Zone Viewer</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <img class="boot-logo" src="./icon.png" alt="Cricket Zone" />
      <div class="boot-spinner"></div>
      <p>Loading Cricket Zone…</p>
    </div>
  </div>
  <noscript>JavaScript is required to use Cricket Zone Viewer.</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
